name: Phase 1 Fedora integration

on:
  push:
    branches: [phase1-safe-session]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fedora port
        uses: actions/checkout@v4

      - name: Checkout pinned Ryoku upstream
        uses: actions/checkout@v4
        with:
          repository: neur0map/ryoku-arch
          ref: 85cd1cbd1f9cd90f72283fbad9094772156ec4f3
          path: upstream

      - name: Set up upstream Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: upstream/ryoku-shell-installer/go.mod
          cache-dependency-path: upstream/ryoku-shell-installer/go.sum

      - name: Validate overlay applicator
        run: python3 -m py_compile scripts/apply-fedora-overlay.py

      - name: Apply Fedora overlay
        run: python3 scripts/apply-fedora-overlay.py upstream

      - name: Check patch cleanliness
        run: git -C upstream diff --check

      - name: Check portable deploy and VM harness syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n upstream/ryoku/shell/deploy.sh
          bash -n prototype/fedora-preflight.sh
          bash -n tests/vm/capture-fedora-host-state.sh
          bash -n tests/vm/verify-fedora-host-preserved.sh
          bash -n tests/vm/install-compositor-rpms.sh

      - name: Verify host-preserving gates exist
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'RYOKU_HOST_PRESERVE=1' upstream/ryoku-shell-installer/engine.go
          grep -F 'skipping automatic full-system upgrade' upstream/ryoku-shell-installer/engine.go
          grep -F 'not removing host packages or disabling existing desktop daemons' upstream/ryoku-shell-installer/engine.go
          grep -F 'keeping ~/.config/xdg-desktop-portal in place' upstream/ryoku-shell-installer/engine.go
          grep -F -- '"--no-reload"' upstream/ryoku-shell-installer/engine.go
          grep -F 'if (( ! host_preserve )) && command -v sudo' upstream/ryoku/shell/deploy.sh
          grep -F 'skipped Arch hardware/container actuators' upstream/ryoku/shell/deploy.sh
          grep -F 'skipped Arch package actuators' upstream/ryoku/shell/deploy.sh
          grep -F 'installed Fedora safety wrapper around Arch system-management CLI commands' upstream/ryoku/shell/deploy.sh
          grep -F 'qtpaths6 --qt-version' upstream/ryoku/shell/deploy.sh
          grep -F 'if (( ! host_preserve )) && command -v makepkg' upstream/ryoku/shell/deploy.sh
          grep -F 'keeping host portal policy untouched' upstream/ryoku/shell/deploy.sh
          grep -F 'X-Ryoku-Fedora-Port=true' upstream/ryoku-shell-installer/fedora.go
          grep -F 'skipping ryoku doctor until Fedora-aware reconcilers land' upstream/ryoku-shell-installer/engine.go

      - name: Run upstream installer tests with Fedora overlay
        working-directory: upstream/ryoku-shell-installer
        run: go test ./...

      - name: Build portable integrated installer
        working-directory: upstream/ryoku-shell-installer
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -o /tmp/ryoku-shell-install .
          sha256sum /tmp/ryoku-shell-install > /tmp/ryoku-shell-install.sha256

      - name: Smoke-test Fedora dry-run plan
        working-directory: upstream/ryoku-shell-installer
        shell: bash
        run: |
          set -euo pipefail
          test -x /tmp/ryoku-shell-install
          go test -run 'TestFedoraSafePlan|TestFedoraPlanDoesNotOfferHostMutationToggles|TestFedoraSessionDesktop|TestRuntimePayloadPatch|TestFedoraPayloadIsPinned|TestDetectDistro' .

      - name: Upload Fedora 44 Phase 1 installer
        uses: actions/upload-artifact@v4
        with:
          name: ryoku-shell-install-fedora44-phase1
          path: |
            /tmp/ryoku-shell-install
            /tmp/ryoku-shell-install.sha256
          if-no-files-found: error
          retention-days: 14


  fedora44-package-map:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Install CI prerequisites
        run: dnf -y install git python3

      - name: Checkout Fedora port
        uses: actions/checkout@v4

      - name: Derive mapped Fedora packages
        run: python3 scripts/list-fedora-packages.py prototype/distro.go > /tmp/ryoku-fedora-packages.txt

      - name: Validate package names against Fedora 44 repos
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          while IFS= read -r pkg; do
            [[ -n "$pkg" ]] || continue
            if dnf -q repoquery "$pkg" 2>/dev/null | grep -q .; then
              printf '[ OK ] %s\n' "$pkg"
            else
              printf '[MISS] %s\n' "$pkg"
              missing+=("$pkg")
            fi
          done < /tmp/ryoku-fedora-packages.txt
          if (( ${#missing[@]} )); then
            printf 'Unresolved Fedora package mappings: %s\n' "${missing[*]}" >&2
            exit 1
          fi

  fedora44-native-build:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Install Fedora build toolchain
        shell: bash
        run: |
          set -euo pipefail
          dnf -y install             git python3 golang gcc gcc-c++ make cmake ninja-build pkgconf-pkg-config             qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtmultimedia-devel             qt6-qtshadertools-devel qt6-qtsvg-devel qt6-qt5compat-devel qt6-qtwayland-devel

      - name: Checkout Fedora port
        uses: actions/checkout@v4

      - name: Checkout pinned Ryoku upstream
        uses: actions/checkout@v4
        with:
          repository: neur0map/ryoku-arch
          ref: 85cd1cbd1f9cd90f72283fbad9094772156ec4f3
          path: upstream

      - name: Apply Fedora overlay
        run: python3 scripts/apply-fedora-overlay.py upstream

      - name: Build Ryoku Go components on Fedora 44
        shell: bash
        run: |
          set -euo pipefail
          for dir in             ryoku/shell/ipc             ryoku/hub/backend             ryoku/rashin/backend             ryoku/cli; do
            printf '==> go build %s\n' "$dir"
            (cd "upstream/$dir" && go build ./...)
          done

      - name: Build Ryoku.Blobs against Fedora Qt
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ryoku-blobs-build /tmp/ryoku-qml
          RYOKU_BLOBS_BUILD=/tmp/ryoku-blobs-build             bash upstream/ryoku/shell/plugin/build.sh /tmp/ryoku-qml
          test -f /tmp/ryoku-qml/Ryoku/Blobs/qmldir
          find /tmp/ryoku-qml/Ryoku/Blobs -name '*.so' -print -quit | grep -q .

      - name: Verify Fedora QML plugin linkage
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r so; do
            echo "==> ldd $so"
            ldd "$so" | tee /tmp/ldd.txt
            ! grep -q 'not found' /tmp/ldd.txt
          done < <(find /tmp/ryoku-qml/Ryoku/Blobs -name '*.so' -type f)

  fedora44-rpm-spec:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Install RPM validation tools
        shell: bash
        run: |
          set -euo pipefail
          dnf -y install git rpm-build dnf-plugins-core

      - name: Checkout Fedora port
        uses: actions/checkout@v4

      - name: Expand Ryoku Hyprland RPM specs
        shell: bash
        run: |
          set -euo pipefail
          rpmspec -P packaging/hyprland/ryoku-hyprland.spec > /tmp/ryoku-hyprland.expanded.spec
          rpmspec -P packaging/hyprland/ryoku-xdg-desktop-portal-hyprland.spec > /tmp/ryoku-xdph.expanded.spec
          test -s /tmp/ryoku-hyprland.expanded.spec
          test -s /tmp/ryoku-xdph.expanded.spec

      - name: Verify private ABI paths
        shell: bash
        run: |
          set -euo pipefail
          grep -F '/usr/libexec/ryoku-hyprland/vendor' /tmp/ryoku-hyprland.expanded.spec
          grep -F '/usr/libexec/ryoku-hyprland/vendor' /tmp/ryoku-xdph.expanded.spec
          ! grep -F '/usr/libexec/hyprland/vendor' /tmp/ryoku-hyprland.expanded.spec
          ! grep -F '/usr/libexec/hyprland/vendor' /tmp/ryoku-xdph.expanded.spec

      - name: Validate Fedora 44 BuildRequires
        shell: bash
        run: |
          set -euo pipefail
          for spec in             packaging/hyprland/ryoku-hyprland.spec             packaging/hyprland/ryoku-xdg-desktop-portal-hyprland.spec; do
            echo "==> BuildRequires for $spec"
            rpmspec -q --buildrequires "$spec" | sort -u > /tmp/buildrequires.txt
            missing=0
            while IFS= read -r req; do
              [[ -n "$req" ]] || continue
              if dnf -q repoquery --whatprovides "$req" 2>/dev/null | grep -q .; then
                printf '[ OK ] %s\n' "$req"
              else
                printf '[MISS] %s\n' "$req"
                missing=1
              fi
            done < /tmp/buildrequires.txt
            (( missing == 0 ))
          done

  fedora44-rpm-source-prep:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Install SRPM tools
        shell: bash
        run: |
          set -euo pipefail
          dnf -y install git rpm-build rpmdevtools patch tar gzip xz

      - name: Checkout Fedora port
        uses: actions/checkout@v4

      - name: Prepare rpmbuild tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/rpmbuild"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}

      - name: Fetch and prep Ryoku Hyprland sources
        shell: bash
        run: |
          set -euo pipefail
          spec=packaging/hyprland/ryoku-hyprland.spec
          spectool -g -R "$spec"
          cp "$spec" "$HOME/rpmbuild/SPECS/"
          rpmbuild -bs "$HOME/rpmbuild/SPECS/ryoku-hyprland.spec" --nodeps
          rpmbuild -bp "$HOME/rpmbuild/SPECS/ryoku-hyprland.spec" --nodeps

      - name: Fetch and prep Ryoku portal sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$HOME/rpmbuild/BUILD"/*
          spec=packaging/hyprland/ryoku-xdg-desktop-portal-hyprland.spec
          spectool -g -R "$spec"
          cp "$spec" "$HOME/rpmbuild/SPECS/"
          rpmbuild -bs "$HOME/rpmbuild/SPECS/ryoku-xdg-desktop-portal-hyprland.spec" --nodeps
          rpmbuild -bp "$HOME/rpmbuild/SPECS/ryoku-xdg-desktop-portal-hyprland.spec" --nodeps

      - name: List generated source RPMs
        run: ls -lh "$HOME/rpmbuild/SRPMS/"

  fedora44-rpm-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: fedora:44
    steps:
      - name: Install RPM build tooling
        shell: bash
        run: |
          set -euo pipefail
          dnf -y install             git rpm-build rpmdevtools dnf-plugins-core             cpio binutils findutils

      - name: Checkout Fedora port
        uses: actions/checkout@v4

      - name: Prepare rpmbuild tree and dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/rpmbuild"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          dnf -y builddep packaging/hyprland/ryoku-hyprland.spec
          dnf -y builddep packaging/hyprland/ryoku-xdg-desktop-portal-hyprland.spec

      - name: Build Ryoku Hyprland RPMs
        shell: bash
        run: |
          set -euo pipefail
          spec=packaging/hyprland/ryoku-hyprland.spec
          spectool -g -R "$spec"
          cp "$spec" "$HOME/rpmbuild/SPECS/"
          rpmbuild -ba "$HOME/rpmbuild/SPECS/ryoku-hyprland.spec"

      - name: Build Ryoku Hyprland portal RPM
        shell: bash
        run: |
          set -euo pipefail
          spec=packaging/hyprland/ryoku-xdg-desktop-portal-hyprland.spec
          spectool -g -R "$spec"
          cp "$spec" "$HOME/rpmbuild/SPECS/"
          rpmbuild -ba "$HOME/rpmbuild/SPECS/ryoku-xdg-desktop-portal-hyprland.spec"

      - name: Verify RPM dependency isolation
        shell: bash
        run: |
          set -euo pipefail
          hypr="$(find "$HOME/rpmbuild/RPMS" -name 'ryoku-hyprland-*.rpm' -type f | head -n1)"
          portal="$(find "$HOME/rpmbuild/RPMS" -name 'ryoku-xdg-desktop-portal-hyprland-*.rpm' -type f | head -n1)"
          test -n "$hypr"
          test -n "$portal"

          echo "==> ryoku-hyprland provides"
          rpm -qp --provides "$hypr" | tee /tmp/hypr-provides
          ! grep -E 'lib(aquamarine|hyprutils|hyprlang|hyprcursor|hyprgraphics|hyprwayland-scanner|hyprwire).*\.so' /tmp/hypr-provides

          echo "==> ryoku-hyprland requires"
          rpm -qp --requires "$hypr" | tee /tmp/hypr-requires
          ! grep -E '^lib(aquamarine|hyprutils|hyprlang|hyprcursor|hyprgraphics|hyprwayland-scanner|hyprwire).*\.so' /tmp/hypr-requires

          echo "==> portal requires"
          rpm -qp --requires "$portal" | tee /tmp/portal-requires
          grep -F 'ryoku-hyprland = 0.56.2-1.fc44' /tmp/portal-requires
          ! grep -E '^lib(hyprutils|hyprlang|hyprwayland-scanner).*\.so' /tmp/portal-requires

      - name: Verify RPM ELF RUNPATHs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hypr-rpm /tmp/portal-rpm
          mkdir -p /tmp/hypr-rpm /tmp/portal-rpm
          hypr="$(find "$HOME/rpmbuild/RPMS" -name 'ryoku-hyprland-*.rpm' -type f | head -n1)"
          portal="$(find "$HOME/rpmbuild/RPMS" -name 'ryoku-xdg-desktop-portal-hyprland-*.rpm' -type f | head -n1)"
          (cd /tmp/hypr-rpm && rpm2cpio "$hypr" | cpio -idmu)
          (cd /tmp/portal-rpm && rpm2cpio "$portal" | cpio -idmu)

          readelf -d /tmp/hypr-rpm/usr/bin/Hyprland | tee /tmp/hypr-readelf
          grep -F 'ryoku-hyprland/vendor' /tmp/hypr-readelf

          portal_bin=/tmp/portal-rpm/usr/libexec/xdg-desktop-portal-hyprland
          readelf -d "$portal_bin" | tee /tmp/portal-readelf
          grep -F '/usr/libexec/ryoku-hyprland/vendor' /tmp/portal-readelf

      - name: Upload Fedora 44 compositor RPMs
        uses: actions/upload-artifact@v4
        with:
          name: ryoku-hyprland-fedora44-rpms
          path: |
            /root/rpmbuild/RPMS/**/*.rpm
            /root/rpmbuild/SRPMS/*.src.rpm
          if-no-files-found: error

